[package]
name = "thumbcraft"
description = "Gera imagens (miniaturas ou em tamanho maior) de documentos Word, planilhas, apresentações e PDF com os motores WordCraft, GridCraft e DeckCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
thumbcraft-core = { path = "../core" }

# WordCraft: abrir, paginar e rasterizar (o render vem reexportado pelo engine).
wordcraft-engine = { path = "../../third_party/wordcraft/crates/engine" }

# GridCraft (com o patch do exportador de PNG): tudo por comandos do engine.
gridcraft-engine = { path = "../../third_party/gridcraft/crates/engine" }

# DeckCraft: os mesmos quatro crates do dc-min.
deckcraft-pptx = { path = "../../third_party/deckcraft/crates/pptx" }
deckcraft-format = { path = "../../third_party/deckcraft/crates/format" }
deckcraft-render = { path = "../../third_party/deckcraft/crates/render" }
deckcraft-fonts = { path = "../../third_party/deckcraft/crates/fonts" }
deckcraft-model = { path = "../../third_party/deckcraft/crates/model" }

# PDF: leitura e rasterização pelo craft-pdf (Hayro), a mesma cópia que o WordCraft e o DeckCraft usam só para
# escrever (o remendo no Cargo.toml raiz aponta tudo para third_party/craft-libs).
craft-pdf = { path = "../../third_party/craft-libs/crates/pdf", default-features = false, features = ["raster"] }

serde_json = "1"
# Mesmas versões que os motores já usam (uma cópia só no binário).
png = "0.18"
zip = { version = "3", default-features = false, features = ["deflate"] }

# Mesma versão e recursos do `image` que os motores já usam: sem crate novo na árvore.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# JPEG e WebP (sem perdas) de saída. Medidos em docs/SIZES.md.
default = ["jpeg", "webp"]
jpeg = ["dep:image", "image/jpeg"]
webp = ["dep:image", "image/webp"]
