# Workspace do thumbcraft: um binário único que gera miniaturas de documentos Word, planilhas
# e apresentações usando os motores WordCraft, GridCraft e DeckCraft (em third_party/, criado
# por scripts/fetch-upstream.sh).
[workspace]
resolver = "3"
members = ["crates/core", "crates/thumbcraft"]
# `cargo test` na raiz roda só o núcleo (rápido, sem compilar os motores).
# Para tudo: `cargo test --workspace`.
default-members = ["crates/core"]
# third_party/ guarda workspaces de terceiros: sem isto o cargo os tomaria por membros deste.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
publish = false

# Uma cópia só do craft-libs (third_party/craft-libs, revisão e patch em UPSTREAM.md e docs/UPSTREAM-CHANGES.md).
# O WordCraft e o DeckCraft pedem o craft-pdf e o krilla da revisão c3487320 por git; o remendo troca tudo pela
# cópia local, então o binário leva uma versão só de cada pacote. O cargo ignora [patch] de dependências, por
# isso o hayro (usado pelo craft-pdf com raster) também é remendado aqui.
[patch."https://github.com/storytold/craft-libs"]
craft-pdf = { path = "third_party/craft-libs/crates/pdf" }

[patch.crates-io]
krilla = { path = "third_party/craft-libs/vendor/krilla" }
hayro = { path = "third_party/craft-libs/vendor/hayro" }
hayro-interpret = { path = "third_party/craft-libs/vendor/hayro-interpret" }
hayro-syntax = { path = "third_party/craft-libs/vendor/hayro-syntax" }
hayro-jbig2 = { path = "third_party/craft-libs/vendor/hayro-jbig2" }

# Perfil voltado a tamanho de binário (valores medidos em docs/SIZES.md).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
